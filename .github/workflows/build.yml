# Build, test and package the four plugins; publish a GitHub release for a v* tag.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # mpc-vst-plugins (skin generator, popup.h, shadow_art): pinned to the commit this port is built and tested with
  MPC_VST_REPO: sd88me/mpc-vst-plugins
  MPC_VST_REF: 39660f2b41c0a6d6e9f8c1f0e19378533d9bbc2f

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: mpc-vst-dragonfly

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MPC_VST_REPO }}
          ref: ${{ env.MPC_VST_REF }}
          path: mpc-vst-plugins

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user libc6-armhf-cross zip
          pip install --break-system-packages ziglang==0.16.0 pillow

      - name: Build (armhf, Zig, glibc 2.36)
        working-directory: mpc-vst-dragonfly
        env:
          MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
          TOOLCHAIN: zig
        run: vst/build.sh > build.log 2>&1 || { tail -80 build.log; exit 1; }; grep -E '^==|^   ' build.log

      - name: Test (PC build under ASan/UBSan, and the device .so under qemu-arm)
        working-directory: mpc-vst-dragonfly
        env:
          MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
        run: vst/test.sh

      - name: Package
        working-directory: mpc-vst-dragonfly
        run: tools/package.sh

      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: mpc-vst-dragonfly
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$(cat VERSION)"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Dragonfly-Force-VST-Collection
          path: |
            mpc-vst-dragonfly/dist/*.zip
            mpc-vst-dragonfly/dist/SHA256SUMS

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: mpc-vst-dragonfly/dist/RELEASE_NOTES.md
          files: |
            mpc-vst-dragonfly/dist/*.zip
            mpc-vst-dragonfly/dist/SHA256SUMS

permissions:
  contents: write
